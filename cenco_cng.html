<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CENCOSUD - Verificación Coordenadas</title>

<!-- ✅ IMPORTS REALES -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin:0; padding:0; height:100%; font-family:Segoe UI; }
#map { height:100%; }

.panel {
  position:absolute;
  top:15px; left:15px;
  z-index:1000;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 15px rgba(0,0,0,0.25);
  width:260px;
  max-height:90%;
  overflow:auto;
}

.item { border-bottom:1px solid #eee; margin-bottom:6px; }

.item-header {
  display:flex; align-items:center;
  cursor:pointer; font-size:13px;
}

.arrow { margin-right:6px; transition:.2s; }
.arrow.open { transform:rotate(180deg); }

.color-box {
  width:12px; height:12px;
  border-radius:3px; margin:0 6px;
}

.tiendas {
  margin-left:20px;
  display:none;
  font-size:12px;
}

.tiendas div {
  cursor:pointer;
  padding:3px 0;
}

.tiendas div:hover { background:#f3f3f3; }
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
<b>Filtro Ruta</b>
<div id="filters"></div>
</div>

<script>

const URL="https://raw.githubusercontent.com/sigmaperu/MapInfo/main/CENCOSUD.csv";

const map=L.map('map').setView([-12.05,-77.04],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers=[], markerMap={}, dataGlobal=[];
let activeRoutes=new Set(), colorMap={}, activeMarker=null, timer=null;

const colors=[
 "#e74c3c","#3498db","#2ecc71","#f39c12",
 "#9b59b6","#16a085","#2c3e50","#e84393"
];

function icon(color,size=22){
 return L.divIcon({
  html:`<svg width="${size}" height="${size*1.5}" viewBox="0 0 24 36">
  <path d="M12 0C5 0 0 6 0 13c0 10 12 23 12 23s12-13 12-23C24 6 19 0 12 0z"
  fill="${color}" stroke="black"/>
  <circle cx="12" cy="13" r="5" fill="white"/>
  </svg>`,
  className:'',
  iconSize:[size,size*1.5],
  iconAnchor:[size/2,size*1.5]
 });
}

fetch(URL).then(r=>r.text()).then(text=>{

 let rows=text.split("\n").map(r=>r.split(","));
 rows.shift();

 dataGlobal=rows.filter(r=>r[8] && r[8].trim());

 let rutas=[...new Set(dataGlobal.map(r=>r[8]))];

 rutas.sort((a,b)=>
  (parseInt(a.replace(/\D/g,''))||0) -
  (parseInt(b.replace(/\D/g,''))||0)
 );

 rutas.forEach((ruta,i)=>{
  colorMap[ruta]=colors[i%colors.length];
  activeRoutes.add(ruta);
 });

 filtros(rutas);
 render();
});

function highlight(tienda){

 let m=markerMap[tienda];
 if(!m) return;

 clearTimeout(timer);

 if(activeMarker && activeMarker!==m){
  activeMarker.setIcon(icon(activeMarker.color,22));
 }

 m.setIcon(icon(m.color,30));
 m.bringToFront();
 m.openTooltip();

 activeMarker=m;
}

function reset(){
 timer=setTimeout(()=>{
  if(activeMarker){
   activeMarker.setIcon(icon(activeMarker.color,22));
   activeMarker=null;
  }
 },80);
}

function filtros(rutas){

 const div=document.getElementById("filters");

 rutas.forEach(ruta=>{

  let cont=document.createElement("div");
  cont.className="item";

  let header=document.createElement("div");
  header.className="item-header";

  let arrow=document.createElement("span");
  arrow.className="arrow";
  arrow.innerHTML="▼";

  let chk=document.createElement("input");
  chk.type="checkbox"; chk.checked=true;

  chk.onchange=()=>{
   chk.checked?activeRoutes.add(ruta):activeRoutes.delete(ruta);
   render();
  };

  let color=document.createElement("div");
  color.className="color-box";
  color.style.background=colorMap[ruta];

  let txt=document.createElement("span");
  txt.innerText=ruta;

  header.append(arrow,chk,color,txt);

  let lista=document.createElement("div");
  lista.className="tiendas";

  let tiendas=[...new Set(dataGlobal
    .filter(r=>r[8]===ruta)
    .map(r=>r[1]))];

  tiendas.forEach(t=>{
    let d=document.createElement("div");
    d.textContent="• "+t;
    d.onmouseenter=()=>highlight(t);
    d.onmouseleave=()=>reset();
    lista.appendChild(d);
  });

  header.onclick=(e)=>{
    if(e.target.type!=="checkbox"){
      let open=lista.style.display==="block";
      lista.style.display=open?"none":"block";
      arrow.classList.toggle("open");
    }
  };

  cont.append(header,lista);
  div.appendChild(cont);
 });
}

function render(){

 markers.forEach(m=>map.removeLayer(m));
 markers=[]; markerMap={}; activeMarker=null;

 dataGlobal.forEach(r=>{

  if(!activeRoutes.has(r[8])) return;

  let lat=parseFloat(r[6]), lon=parseFloat(r[7]);
  if(!lat||!lon) return;

  let m=L.marker([lat,lon],{icon:icon(colorMap[r[8]])})
   .bindTooltip(`<b>${r[1]}</b><br>VH: ${r[2]}`)
   .addTo(map);

  m.color=colorMap[r[8]];
  markers.push(m);
  markerMap[r[1]]=m;
 });
}

</script>

</body>
</html>
``
