<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CENCOSUD - Verificación Coordenadas</title>

<!-- ✅ ESTO ARREGLA TODO -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{margin:0;height:100%;font-family:Segoe UI;}
#map{height:100%;}

/* PANEL */
.panel{
 position:absolute;
 top:10px; left:10px;
 z-index:1000;
 background:white;
 padding:10px;
 border-radius:10px;
 box-shadow:0 4px 15px rgba(0,0,0,0.3);
 width:260px;
 max-height:85%;
 overflow:auto;
 transition:.3s;
}

@media(max-width:768px){
 .panel{ width:85%; }
}

/* botón móvil */
.toggleBtn{
 position:absolute;
 top:10px; left:10px;
 z-index:1100;
 background:#2c3e50;
 color:white;
 padding:8px 12px;
 border-radius:8px;
 cursor:pointer;
 display:none;
}

@media(max-width:768px){
 .toggleBtn{ display:block; }
 .panel.hidden{ left:-100%; }
}

/* ITEMS */
.item{border-bottom:1px solid #eee;margin-bottom:6px;}

.item-header{
 display:flex;
 align-items:center;
 cursor:pointer;
 font-size:13px;
}

.arrow{margin-right:6px;transition:.2s;}
.arrow.open{transform:rotate(180deg);}

.color-box{
 width:12px;height:12px;
 border-radius:3px;margin:0 6px;
}

.tiendas{
 margin-left:20px;
 display:none;
 font-size:12px;
}

.tiendas div{
 padding:4px;
 cursor:pointer;
}

.tiendas div:hover{background:#f3f3f3;}
</style>
</head>

<body>

<div class="toggleBtn" onclick="togglePanel()">☰</div>

<div id="map"></div>

<div class="panel" id="panel">
<b>Filtro Ruta</b>
<div id="filters"></div>
</div>

<script>

const URL="https://raw.githubusercontent.com/sigmaperu/MapInfo/main/CENCOSUD.csv";

const map=L.map('map').setView([-12.05,-77.04],11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers=[], markerMap={}, data=[];
let activeRoutes=new Set(), colorMap={};
let activeMarker=null, timer=null;

const colors=[
 "#e74c3c","#3498db","#2ecc71","#f39c12",
 "#9b59b6","#16a085","#2c3e50","#e84393"
];

// ICONO
function icon(color,size=22){
 return L.divIcon({
  html:`<svg width="${size}" height="${size*1.5}" viewBox="0 0 24 36">
  <path d="M12 0C5 0 0 6 0 13c0 10 12 23 12 23s12-13 12-23"
  fill="${color}" stroke="black"/>
  <circle cx="12" cy="13" r="5" fill="white"/>
  </svg>`,
  className:'',
  iconSize:[size,size*1.5],
  iconAnchor:[size/2,size*1.5]
 });
}

// LOAD
fetch(URL).then(r=>r.text()).then(t=>{

 let rows=t.split("\n").map(r=>r.split(","));
 rows.shift();

 data=rows.filter(r=>r[8] && r[8].trim());

 let rutas=[...new Set(data.map(r=>r[8]))];

 rutas.sort((a,b)=>
  (parseInt(a.replace(/\D/g,''))||0) -
  (parseInt(b.replace(/\D/g,''))||0)
 );

 rutas.forEach((r,i)=>{
   colorMap[r]=colors[i%colors.length];
   activeRoutes.add(r);
 });

 buildFilters(rutas);
 render();
});

// HIGHLIGHT
function highlight(name){

 let m=markerMap[name];
 if(!m) return;

 clearTimeout(timer);

 if(activeMarker && activeMarker!==m){
   activeMarker.setIcon(icon(activeMarker.color,22));
 }

 m.setIcon(icon(m.color,30));
 m.bringToFront();
 m.openTooltip();

 activeMarker=m;
}

function reset(){
 clearTimeout(timer);
 timer=setTimeout(()=>{
   if(activeMarker){
     activeMarker.setIcon(icon(activeMarker.color,22));
     activeMarker=null;
   }
 },120);
}

// 🔥 FIX CLAVE
map.on('click',reset);

// FILTROS
function buildFilters(rutas){

 let div=document.getElementById("filters");

 rutas.forEach(r=>{

  let cont=document.createElement("div");
  cont.className="item";

  let header=document.createElement("div");
  header.className="item-header";

  let arrow=document.createElement("span");
  arrow.className="arrow";
  arrow.innerHTML="▼";

  let chk=document.createElement("input");
  chk.type="checkbox"; chk.checked=true;

  chk.onchange=()=>{
    chk.checked?activeRoutes.add(r):activeRoutes.delete(r);
    render();
  };

  let color=document.createElement("div");
  color.className="color-box";
  color.style.background=colorMap[r];

  let txt=document.createElement("span");
  txt.innerText=r;

  header.append(arrow,chk,color,txt);

  let list=document.createElement("div");
  list.className="tiendas";

  let tiendas=[...new Set(data.filter(x=>x[8]===r).map(x=>x[1]))];

  tiendas.forEach(t=>{

    let d=document.createElement("div");
    d.textContent="• "+t;

    d.onmouseenter=()=>highlight(t);
    d.onmouseleave=()=>reset();

    d.onclick=()=>{
      highlight(t);
      setTimeout(reset,1500);
    };

    list.appendChild(d);
  });

  header.onclick=(e)=>{
    if(e.target.type!=="checkbox"){
      let open=list.style.display==="block";
      list.style.display=open?"none":"block";
      arrow.classList.toggle("open");
    }
  };

  cont.append(header,list);
  div.appendChild(cont);
 });

}

// RENDER
function render(){

 markers.forEach(m=>map.removeLayer(m));
 markers=[]; markerMap={};
 activeMarker=null;

 data.forEach(r=>{

  if(!activeRoutes.has(r[8])) return;

  let lat=parseFloat(r[6]), lon=parseFloat(r[7]);
  if(!lat||!lon) return;

  let m=L.marker([lat,lon],{icon:icon(colorMap[r[8]])})
   .bindTooltip(`<b>${r[1]}</b><br>VH: ${r[2]}`)
   .addTo(map);

  m.color=colorMap[r[8]];
  markers.push(m);
  markerMap[r[1]]=m;
 });

}

// PANEL
function togglePanel(){
 document.getElementById("panel").classList.toggle("hidden");
}

</script>

</body>
</html>
