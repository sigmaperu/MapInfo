<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificación Coordenadas CENCOSUD</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  html, body { margin:0; padding:0; height:100%; }
  #map { height:100%; }

  .panel {
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.3);
    font-family:Arial;
    font-size:13px;
    max-height:90%;
    overflow:auto;
  }

  .panel label {
    display:block;
    margin-bottom:4px;
  }
</style>
</head>

<body>

<div id="map"></div>

<div class="panel">
  <strong>Filtro Ruta</strong>
  <div id="filters"></div>
</div>

<script>

// ========================
// CONFIG
// ========================
const URL = "https://raw.githubusercontent.com/sigmaperu/MapInfo/main/CENCOSUD.csv";

// ========================
// MAPA
// ========================
const map = L.map('map').setView([-12.05, -77.04], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ========================
// VARIABLES
// ========================
let markers = [];
let dataGlobal = [];
let activeRoutes = new Set();
let colorMap = {};

const colors = [
  "red","blue","green","orange","purple",
  "cadetblue","black","pink"
];

// ========================
// ICONO tipo Google Maps
// ========================
function createIcon(color) {
  return L.divIcon({
    className: '',
    html: `
      <svg width="22" height="34" viewBox="0 0 24 36">
        <path d="M12 0C5 0 0 6 0 13c0 10 12 23 12 23s12-13 12-23C24 6 19 0 12 0z"
              fill="${color}" stroke="black"/>
        <circle cx="12" cy="13" r="5" fill="white"/>
      </svg>
    `,
    iconSize: [22,34],
    iconAnchor: [11,34]
  });
}

// ========================
// CARGAR CSV
// ========================
fetch(URL)
  .then(r => r.text())
  .then(text => {

    let rows = text.split("\n").map(r => r.split(","));
    rows.shift();

    // ✅ eliminar registros sin ruta
    rows = rows.filter(r => r[8] && r[8].trim() !== "");

    dataGlobal = rows;

    // rutas únicas
    let rutasUnicas = [...new Set(rows.map(r => r[8]))];

    // asignar colores + activar todos
    rutasUnicas.forEach((ruta, i) => {
      colorMap[ruta] = colors[i % colors.length];
      activeRoutes.add(ruta);
    });

    crearFiltros(rutasUnicas);
    render();
  });

// ========================
// FILTROS
// ========================
function crearFiltros(rutas) {

  const div = document.getElementById("filters");

  rutas.forEach(ruta => {

    let chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = true;

    chk.onchange = () => {
      if (chk.checked) activeRoutes.add(ruta);
      else activeRoutes.delete(ruta);
      render();
    };

    let label = document.createElement("label");
    label.appendChild(chk);
    label.append(" " + ruta);

    div.appendChild(label);
  });
}

// ========================
// RENDER (CORE)
// ========================
function render(){

  // eliminar markers actuales
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  dataGlobal.forEach(r => {

    let ruta = r[8];
    if (!activeRoutes.has(ruta)) return;

    let lat = parseFloat(r[6]);
    let lon = parseFloat(r[7]);

    if (!lat || !lon) return;

    let tienda = r[1];
    let vh = r[2];

    let marker = L.marker([lat, lon], {
      icon: createIcon(colorMap[ruta])
    });

    marker.bindTooltip(`<b>${tienda}</b><br>VH: ${vh}`);

    marker.addTo(map);
    markers.push(marker);
  });
}

</script>

</body>
</html>
